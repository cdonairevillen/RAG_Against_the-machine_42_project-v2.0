services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      # Named volume: Qdrant needs a POSIX filesystem, which Windows bind
      # mounts do not provide.
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
