[project]
name = "student"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "pydantic",
    "bm25s",
    "tqdm",
    "fire",
    "flake8",
    "mypy",
    "llm-sdk",
    "streamlit",
    "sentence-transformers",
    "qdrant-client==1.19.1",
    "tomli>=2.0 ; python_full_version < '3.11'",
    # Declared here (llm_sdk already needs it) only to pick the CUDA build.
    "torch>=2.0.0",
    "accelerate>=1.15.0",
    "pyarrow>=15",
    # Converts the CV (.docx) and the LinkedIn PDF (Phase 4b).
    "docling>=2.142.1",
    # Docling's layout model needs it; declared to take the CUDA build
    # matching torch (the PyPI wheel breaks torchvision::nms).
    "torchvision",
    "mcp>=2.3.0",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk", editable = true }
# CUDA 12.6 build: runs on old drivers (42 machines) and falls back to CPU
# when there is no GPU. macOS keeps the default PyPI wheel.
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = "llm_sdk"
explicit_package_bases = true

warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# With Docling's optional dependencies, importing transformers pulls in
# sklearn -> pandas -> pyarrow, and loading pyarrow while faulthandler is
# active crashes Python on Windows (segfault before any test runs).
# Normal runs do not enable faulthandler; only pytest does.
addopts = "-p no:faulthandler"
pythonpath = ["."]
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
