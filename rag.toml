# RAG Against the Machine — pipeline configuration.
# Every value can be overridden with an environment variable named
# RAG_<SECTION>_<KEY> (e.g. RAG_QDRANT_URL=http://other-host:6333).

[qdrant]
# 127.0.0.1, not localhost: on Windows, Python (httpx) tries IPv6 first
# and waits ~2 s per request before falling back (FASE_9.md 9b, DEC-49).
url = "http://127.0.0.1:6333"
collection_prefix = "rag_"
batch_size = 512

[paths]
processed_dir = "data/processed"

[chunking]
code_chunk_size = 2000
doc_chunk_size = 2000
code_child_size = 600
doc_child_size = 600

[models]
# "auto" = CUDA if a GPU is available, CPU otherwise (e.g. 42 machines
# without GPU). Force with "cpu" / "cuda" or RAG_MODELS_DEVICE=cpu.
device = "auto"

[retrieval]
# Tuned with `make bench` (see docs/changelog/FASE_2.md).
classifier_margin = 0.5
code_signal_weight = 0.5
doc_signal_weight = 0.5
# Code-mode queries are always reranked (v1 skipped it above 9.0).
skip_rerank_score = inf
# Out-of-domain gate before generation (B15): minimum cross-encoder
# logit of the best source (0 = 50% relevance). Measured: rejects 82% of
# out-of-domain questions and 0.9% of legitimate ones.
relevance_threshold = 0.0
# Fallback gate when no reranker is loaded (weak signal, kept as such).
bm25_score_floor = 5.5
# Multilingual (ms-marco-MiniLM-L-6-v2 is English only); see
# docs/BENCHMARK_REPORT.md.
reranker_model = "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
# "rrf": fuse the reranker order with the BM25 order(s); "replace": the
# reranker order wins (v1 behaviour).
rerank_fusion = "rrf"
rrf_k = 60
# BM25 identifier splitting (`max_model_len` -> max model len):
# "none" | "query" | "both" | "code" (code chunks and code/general-index
# queries only). Changing it requires `make index`.
code_aware_tokens = "code"

[generation]
# The base LLM (comparable with other 42 RAGs). Other models are optional
# profiles below; all load through llm_sdk.
model = "Qwen/Qwen3-0.6B"
max_new_tokens = 150
max_input_tokens = 3072

[embeddings]
# Dense retrieval fused with BM25 (RRF), in both branches. Changing the
# model needs `make index`. Without a GPU, indexing with bge-m3 takes
# ~2 h; use intfloat/multilingual-e5-small (~13 min on CPU) instead.
enabled = true
model = "BAAI/bge-m3"
batch_size = 64
dense_k = 50
dense_in_doc_branch = true

# One block per knowledge source. `chunkers` maps a file extension to a
# chunker name (see src/rag/ingestion/chunkers.py); unknown extensions fall
# back to `default_chunker`.
[sources.vllm]
description = "vLLM 0.10.1 documentation and source code: serving LLMs, configuration, APIs, models, hardware and internals."
root = "data/raw/vllm-0.10.1"
include = [".py", ".pyi", ".md", ".rst", ".txt"]
exclude_dirs = [
    "csrc", ".buildkite", ".github", "cmake", "docker", ".gemini",
    "requirements", "__pycache__", ".git", "node_modules", "tests",
    "examples",
]
code_extensions = [".py", ".pyi"]
default_chunker = "size"

[sources.vllm.chunkers]
".py" = "python_ast"
".pyi" = "python_ast"
".md" = "markdown_headers_packed"
".rst" = "markdown_headers_packed"
".txt" = "markdown_headers_packed"

# XQuAD (Phase 4a): general knowledge, English and Spanish in one
# domain. Built by `make data-xquad` (one Markdown file per Wikipedia
# article, see src/rag/sources/xquad.py). CC-BY-SA 4.0: cite the source.
[sources.xquad]
description = "General knowledge from 48 Wikipedia articles (English and Spanish): history, science, geography, sports, companies and more."
root = "data/raw/xquad"
include = [".md"]
default_chunker = "markdown_headers_packed"
# Own out-of-domain gate: the reranker scores Wikipedia lower than the
# vLLM docs, and the global 0.0 rejected ~18% of valid questions. -2.0
# accepts 93% (en/es) and still rejects every out-of-domain and vLLM
# question measured (`gate_scores`, docs/changelog/FASE_4.md).
relevance_threshold = -2.0

# CV mode (Phase 4b): Chrystian's CV (.docx), LinkedIn profile (.pdf)
# and biography (.md, Spanish original + English version), indexed as
# they are, each in its own language.
# Word/PDF go through Docling (src/rag/ingestion/loaders.py). Git-ignored.
[sources.cv]
description = "Chrystian Donaire Villén, the author of this project: CV, LinkedIn profile and biography (education, jobs, projects, skills, hobbies, contact)."
root = "data/raw/cv"
include = [".md", ".docx", ".pdf"]
default_chunker = "markdown_headers_packed"
# The phone number and the old e-mail stay in the files but are never
# shown: masked in the LLM context, the answer and the sources.
private_data = ["phone", "email"]
public_emails = ["cdonairevillen@gmail.com"]
private_replacement = "[dato privado]"
# Appended to the system prompt when answering from the CV (FASE_4.md,
# 4b): the 0.6B model mixed jobs and invented the secret literary world.
prompt_rules = """
The SOURCES describe one person, Chrystian Donaire Villén: his CV, his LinkedIn profile and his biography. Also follow these rules:
7. Answer about Chrystian in the third person.
8. Each job, project and date belongs to the company or project named next to it in the same source. Never mix details of different jobs.
9. Books, films and music in the SOURCES are his tastes, not works he created.
10. His literary world is a secret project: if asked about it, say only that it is secret and that more will be known soon.
11. His only public contact is the e-mail cdonairevillen@gmail.com. Never present it as another address. If asked for a phone number or any other contact detail, say that it is private and give that e-mail.
"""
# The CV keeps the short rule 6 with every model: longer answers made up
# facts ("he has no pets") instead of the CV message (FASE_8.md, 8g).
style_rule = "6. Be direct and concise: a few sentences, no preamble."
# Calibrated with `gate_scores` for the 800-char chunks below (FASE_4.md,
# 4b): the global 0.0 rejected over 40% of valid English questions;
# -3.0 accepts 83% (en) / 90% (es) and no out-of-domain question.
# Rejections still end in the CV message below.
relevance_threshold = -3.0
# Questions that name the author go to the CV when it passes its gate,
# even if "about" (whose docs and code mention him) scores higher.
route_hints = ['\b(chrystian|donaire)\b']
# Questions about "the author" of this project go to the CV whatever its
# score and skip its gate (among the web's most asked questions). Not
# "the author of <a book>" (XQuAD).
route_names = [
    '\b(el|the|tu|your) (autor|author|creador|creator)\b(?!\s+(de|del|of)\b)',
    '\b(autor|author|creador|creator) (de|del|of) (este|esta|tu|this|your|the|el) (rag|proyecto|project|web|website|app|aplicaci[oó]n|sistema|system|chatbot|asistente|assistant)\b',
]
# The English CV comes first for English questions and lacks the
# biography-only facts: more sources bring the biography in too.
answer_k = 8
# Smaller chunks (one job or section each) so the model does not mix
# facts of neighbouring jobs, and 8 of them fit the token budget.
chunk_size = 800
child_size = 400

# Granite 4.0 Micro only (FASE_8.md 8a): it answered the Hotmail question
# with the Gmail, presented as the Hotmail. The Qwen prompts stay as is.
# Its "ask him yourself" answer only when the question is about the author
# (Phase 10): "where was Nikola Tesla born?" also lands here (the birth
# details look alike) and gets the generic "not found".
not_found_when = [
    '\b(chrystian|donaire|vill[eé]n)\b',
    '\b(el|al|del|the|tu|your) (autor|author|creador|creator)\b',
    '\b([eé]l|he|him|his)\b',
]

[sources.cv.model_rules]
"ibm-granite/granite-4.0-micro" = """
12. cdonairevillen@gmail.com is a Gmail address. If asked for his Hotmail, Outlook or any other e-mail, his phone, WhatsApp or home address, never answer with that Gmail as if it were the requested one: say that it is private, then give the Gmail as his public contact.
"""

[sources.cv.not_found_message]
es = "No dispongo de esa información, ¡pero puedes preguntárselo tú! cdonairevillen@gmail.com"
en = "I don't have that information, but you can ask him yourself! cdonairevillen@gmail.com"

# About (Phase 7a): the project explaining itself, from its own README,
# working docs and source code, read live from the repository (no copy:
# `make index SOURCE=about` after editing them). Left out: the data, the
# benchmarks, the web, the tests, the course SDK, the deployment bundle
# and stage (a copy of src/), and the initial planning documents.
[sources.about]
description = "This project itself, RAG against the Machine v2.0: what it is, how it works (ingestion, hybrid retrieval, router, generation, agent, MCP, web), its models, benchmarks, design decisions and history, and its source code."
root = "."
include = [".md", ".py"]
exclude_dirs = [
    "data", "bench", "web", "tests", "llm_sdk", "__pycache__",
    "node_modules", "PLANING.md", "RESPUESTA.md", "Elements_frontend.md",
    "CLAUDE.md", "IMPORTANTE.md", "PLAN_FASES_9_10.md", "LLM_EXTERNO.md",
]
# deploy/space/README.md is the old Hugging Face Space card (the
# deployment is on Oracle): the project's README covers it.
# RESPUESTAS_ARCHIVADAS.md keeps the test questions and wrong answers
# verbatim: indexed, the search returned them instead of the answers
# (DEC-39, FASE_7.md 7b.9).
# Option B (Phase 10, 2026-11-25): only the code, the README and the
# benchmark report. The work log (roadmap, decisions, changelogs) repeats
# the author's name and the CV, took CV questions and diluted the README
# as it grew (about R@5 0.56 -> 0.33 between runs 79 and 171). Deploy
# guides and the video script (video/, git-ignored) stay out too.
exclude_paths = [
    "deploy/stage", "deploy/bundle", "deploy/space/README.md",
    "docs/es/RESPUESTAS_ARCHIVADAS.md",
    "docs/ROADMAP.md", "docs/es/ROADMAP.md",
    "docs/decisions.md", "docs/es/decisions.md",
    "docs/changelog", "docs/es/changelog",
    "docs/es/DETECTOR_BUCLES.md",
    "deploy/README.md", "deploy/local/README.md", "video",
]
# The working docs exist in Spanish (docs/es/) and English (docs/). The
# filter below gives English questions only the English copy (Spanish
# ones keep both). Measured (FASE_7.md 7b.4, DEC-23): better retrieval
# and much better answers with Qwen3-0.6B. On since DEC-34 (7b.8).
translations = [
    ["README.md", "docs/es/README.md"],
    ["docs/", "docs/es/"],
]
translation_languages = ["en"]
# Test transcripts quoting CV answers, marked inside the changelogs, are
# left out (they made the router pick "about" for CV questions).
skip_marked = true
# Own gate (`gate_scores`, FASE_7.md 7a.7): -1.0 accepted 83% (en) /
# 78% (es) of the questions about the project; the global 0.0 only 67%.
# Recalibrated in Phase 8b (FASE_8.md 8b) on the clean index: -1.25
# recovers two project questions with every model; -1.5 let an
# out-of-domain question through.
relevance_threshold = -1.25
# Questions that name the project go to "about" when it passes its gate
# (a hint alone never decides: XQuAD also has "the project").
route_hints = [
    '\b(this|the|your) project\b',
    '\b(este|el|tu) proyecto\b',
    'rag against the machine',
]
# Questions that name it beyond doubt, or ask the assistant what it is,
# go to "about" whatever its score and skip its gate (among the web's
# most asked questions; FASE_7.md 7b.5).
route_names = [
    'rag against the machine',
    '\b(este|esta|tu|vuestro) (rag|proyecto|sistema|chatbot|asistente|web|aplicaci[oó]n)\b',
    '\b(this|your) (rag|project|system|chatbot|assistant|website|app)\b',
    '\b(qu[eé]|qui[eé]n) eres\b',
    '\bpara qu[eé] (sirves|vales)\b',
    '\bqu[eé] (puedes|sabes) hacer\b',
    '\b(what|who) are you\b',
    '\bwhat (can|do) you do\b',
    '\bqui[eé]n te (ha|hizo|cre[oó]|program[oó])\b',
    '\bwho (made|built|created|programmed) you\b',
]
# The small models took "you" for the reader ("you are a RAG system").
prompt_rules = """
7. You are this project's assistant. If the question asks about you (what you are, what you can do, who made you), it asks about this project: answer in the first person ("I am...").
"""
# The web always searches it (chip always on, it joins every filter).
pinned = true
code_extensions = [".py"]
default_chunker = "markdown_headers_packed"

# Asked of the assistant itself, those questions find nothing useful
# with their own words: "about" is searched with these instead (the LLM
# still gets the original question).
[sources.about.route_queries]
'\b(qu[eé]|qui[eé]n) eres\b|\bpara qu[eé] (sirves|vales)\b|\bqu[eé] (puedes|sabes) hacer\b' = "¿Qué es RAG against the Machine y qué puede hacer?"
'\b(what|who) are you\b|\bwhat (can|do) you do\b' = "What is RAG against the Machine and what can it do?"
'\bqui[eé]n te (ha|hizo|cre[oó]|program[oó])\b' = "¿Quién es el autor de RAG against the Machine?"
'\bwho (made|built|created|programmed) you\b' = "Who is the author of RAG against the Machine?"

[sources.about.chunkers]
".py" = "python_ast"
".md" = "markdown_headers_packed"

# Films (Phase 9): one Markdown file per film, built by `make film` from
# data/raw/film/<Title (Year)>/ (video + .srt): dialogue and scene
# descriptions in sections headed by their time ("## 00:12:30 - ...",
# src/rag/sources/film.py). Git-ignored. Hidden from the web unless the
# API starts with API_SHOW=film (only on the demo days).
[sources.film]
description = "Three films, by time: Shrek (2001) and Shrek 2 (2004), in English, and El método (2005), a Spanish film about a job interview. What the characters say, what is seen on screen, scene summaries and character profiles."
root = "data/film"
include = [".md"]
exclude_dirs = [".work"]
default_chunker = "markdown_headers_packed"
web = false
# Doc-branch reranking for this domain only (FASE_9.md 9b): the answer
# in the top 5 for 9/14 Spanish questions instead of 4/14 (English 11/14
# either way). The global setting stays off (it lowers the vLLM docs).
rerank_doc_branch = true
# Doc branch without BM25 (dense list only, then the reranker): the
# corpus is English, so BM25 finds nothing for Spanish questions and its
# list buried the dense hits in the fusion (FASE_9.md 9b).
bm25_in_doc_branch = false
# Sources in film order (time) in the LLM context, not relevance order.
chronological_context = true
# Own gate (`gate_scores`, 40 questions per group, FASE_9.md 9b): the
# global 0.0 rejected 71% (en) / 71% (es) of the film questions; -3.0
# accepts 79% / 71%. Spanish out-of-domain questions score high on every
# domain: route-bench checks which domain wins them.
relevance_threshold = -2.0
# A question that names an ingested film by its title goes to this domain
# and skips the gate (Phase 10): titles from the files in `root`; one that
# starts with an article ("El método") only counts at the end of the
# question or after "película"/"film" (src/rag/sources/film.py).
route_names_from_titles = true

# The character profiles (<Title>.characters.md, film_enrich.py): one
# chunk each, so a profile is never packed with anything else (and cited
# or played with another clip). The scene summaries (<Title>.summaries.md)
# keep the default, packed together. DEC-55, DEC-56.
[sources.film.chunkers]
".characters.md" = "markdown_sections"
# The film's synopsis (Phase 10): one chunk.
".synopsis.md" = "markdown_sections"

# Optional profiles: extra models as explicit options on top of the
# stable base above (which is what the official benchmark uses and gives
# the same results on any machine). Select with --profile <name>,
# RAG_PROFILE=<name> or `make <target> PROFILE=<name>`. A profile that
# changes embeddings needs `make index PROFILE=<name>` first.

[profiles.gpu-quality.retrieval]
# Best measured reranker (code R@5 0.86 vs 0.80), but ~4.4 s per question
# on GPU and ~23 s on CPU: only for machines with a GPU.
reranker_model = "BAAI/bge-reranker-v2-m3"

[profiles.cpu-light.embeddings]
# Index in ~13 min on CPU instead of ~2 h with bge-m3 (lower recall,
# see docs/BENCHMARK_REPORT.md).
model = "intfloat/multilingual-e5-small"

# Optional LLMs (generation only; no re-index needed): the rest of the
# Qwen3 family. Quality and speed in docs/BENCHMARK_REPORT.md (SmolLM3-3B
# was measured and dropped: lowest F1 and most false refusals on code;
# Phi-4-mini was dropped in Phase 7: its answers copied the sources and
# looped, DEC-32).
[profiles."llm-qwen3-1.7b".generation]
model = "Qwen/Qwen3-1.7B"
# Longer answers (FASE_8.md, 8g, rule S5): measured, not adopted (more
# false "not found" on code with the agent). Uncomment to use it; the CV
# keeps the short rule either way ([sources.cv] style_rule).
# style_rule = "6. Be direct, no preamble: give the answer, then explain it briefly in two or three more sentences."

[profiles.llm-qwen3-4b.generation]
model = "Qwen/Qwen3-4B"

# 4B (~8 GB) + bge-m3 + reranker do not fit together in a 12 GB GPU:
# retrieval runs on CPU (same results, measured in Phase 2).
[profiles.llm-qwen3-4b.models]
device = "cpu"

# Another model family (Phase 8, DEC-32): IBM Granite 4.0 Micro, the
# dense 3B (attention layers only), Apache 2.0, Spanish among its
# languages. Being evaluated: FASE_8.md 8a.
[profiles.llm-granite-micro.generation]
model = "ibm-granite/granite-4.0-micro"
# The agent answers the user's question (plus its rewrite in a
# conversation), not the rewrite alone: follow-ups 0.94 -> 1.00, single
# questions equal (DEC-63). The 0.6B and the 1.7B keep "rewrite".
agent_answer_with = "context"

# External models (Phase 10, 10a): an OpenAI-compatible API instead of a
# local model (src/llm/remote.py). Same retrieval, prompt and clean-up;
# the key stays in .env (NVIDIA_API_KEY). Free tier of build.nvidia.com,
# ~40 requests/min (docs/es/LLM_EXTERNO.md). Reasoning off: with it on,
# Lightning spent every token thinking. Token limits as the base, so
# gen-bench compares with the local models. Lightning and Gemini: the
# agent answers the user's question, not its keyword rewrite (DEC-63).
[profiles.llm-nvidia-lightning.generation]
model = "nvidia/nemotron-3.5-lightning-30b-a3b"
provider = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
extra_body = { chat_template_kwargs = { enable_thinking = false } }
agent_answer_with = "context"

# Bolt keeps "rewrite": with the user's own "what are you?" it answers
# only "I am this project's assistant [7]" (about's rule 7), worse in
# the basic-questions check (DEC-63).
[profiles.llm-nvidia-bolt.generation]
model = "nvidia/nemotron-3.5-bolt-e4b"
provider = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
extra_body = { chat_template_kwargs = { enable_thinking = false } }

# Google AI Studio (Gemini API), free tier, through its OpenAI-compatible
# endpoint; key in .env (GEMINI_API_KEY). Reasoning off ("none" for
# Flash; Flash-Lite only accepts "minimal"). Gemini 4 has no free quota.
[profiles.llm-gemini-flash.generation]
model = "gemini-3.5-flash"
provider = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
extra_body = { reasoning_effort = "none" }
agent_answer_with = "context"

[profiles.llm-gemini-lite.generation]
model = "gemini-3.5-flash-lite"
provider = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
extra_body = { reasoning_effort = "minimal" }
agent_answer_with = "context"

# Its own daily quota (Google counts per model): the fallback when 3.5
# Flash-Lite runs out. Slower (8-45 s when tested, often busy).
[profiles.llm-gemini-lite-31.generation]
model = "gemini-3.1-flash-lite"
provider = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
extra_body = { reasoning_effort = "minimal" }
agent_answer_with = "context"
# A short wait: as a fallback, the local model should not be far behind.
timeout = 30.0
retries = 2
