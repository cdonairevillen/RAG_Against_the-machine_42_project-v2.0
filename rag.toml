# RAG Against the Machine — pipeline configuration.
# Every value can be overridden with an environment variable named
# RAG_<SECTION>_<KEY> (e.g. RAG_QDRANT_URL=http://other-host:6333).

[qdrant]
url = "http://localhost:6333"
collection_prefix = "rag_"
batch_size = 512

[paths]
processed_dir = "data/processed"

[chunking]
code_chunk_size = 2000
doc_chunk_size = 2000
code_child_size = 600
doc_child_size = 600

[models]
# "auto" = CUDA if a GPU is available, CPU otherwise (e.g. 42 machines
# without GPU). Force with "cpu" / "cuda" or RAG_MODELS_DEVICE=cpu.
device = "auto"

[retrieval]
# Tuned with `make bench` (see docs/changelog/FASE_2.md).
classifier_margin = 0.5
code_signal_weight = 0.5
doc_signal_weight = 0.5
# Code-mode queries are always reranked (v1 skipped it above 9.0).
skip_rerank_score = inf
# Out-of-domain gate before generation (B15): minimum cross-encoder
# logit of the best source (0 = 50% relevance). Measured: rejects 82% of
# out-of-domain questions and 0.9% of legitimate ones.
relevance_threshold = 0.0
# Fallback gate when no reranker is loaded (weak signal, kept as such).
bm25_score_floor = 5.5
# Multilingual (ms-marco-MiniLM-L-6-v2 is English only); see
# docs/BENCHMARK_REPORT.md.
reranker_model = "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
# "rrf": fuse the reranker order with the BM25 order(s); "replace": the
# reranker order wins (v1 behaviour).
rerank_fusion = "rrf"
rrf_k = 60
# BM25 identifier splitting (`max_model_len` -> max model len):
# "none" | "query" | "both" | "code" (code chunks and code/general-index
# queries only). Changing it requires `make index`.
code_aware_tokens = "code"

[generation]
# The base LLM (comparable with other 42 RAGs). Other models are optional
# profiles below; all load through llm_sdk.
model = "Qwen/Qwen3-0.6B"
max_new_tokens = 150
max_input_tokens = 3072

[embeddings]
# Dense retrieval fused with BM25 (RRF), in both branches. Changing the
# model needs `make index`. Without a GPU, indexing with bge-m3 takes
# ~2 h; use intfloat/multilingual-e5-small (~13 min on CPU) instead.
enabled = true
model = "BAAI/bge-m3"
batch_size = 64
dense_k = 50
dense_in_doc_branch = true

# One block per knowledge source. `chunkers` maps a file extension to a
# chunker name (see src/rag/ingestion/chunkers.py); unknown extensions fall
# back to `default_chunker`.
[sources.vllm]
description = "vLLM 0.10.1 documentation and source code: serving LLMs, configuration, APIs, models, hardware and internals."
root = "data/raw/vllm-0.10.1"
include = [".py", ".pyi", ".md", ".rst", ".txt"]
exclude_dirs = [
    "csrc", ".buildkite", ".github", "cmake", "docker", ".gemini",
    "requirements", "__pycache__", ".git", "node_modules", "tests",
    "examples",
]
code_extensions = [".py", ".pyi"]
default_chunker = "size"

[sources.vllm.chunkers]
".py" = "python_ast"
".pyi" = "python_ast"
".md" = "markdown_headers_packed"
".rst" = "markdown_headers_packed"
".txt" = "markdown_headers_packed"

# XQuAD (Phase 4a): general knowledge, English and Spanish in one
# domain. Built by `make data-xquad` (one Markdown file per Wikipedia
# article, see src/rag/sources/xquad.py). CC-BY-SA 4.0: cite the source.
[sources.xquad]
description = "General knowledge from 48 Wikipedia articles (English and Spanish): history, science, geography, sports, companies and more."
root = "data/raw/xquad"
include = [".md"]
default_chunker = "markdown_headers_packed"
# Own out-of-domain gate: the reranker scores Wikipedia lower than the
# vLLM docs, and the global 0.0 rejected ~18% of valid questions. -2.0
# accepts 93% (en/es) and still rejects every out-of-domain and vLLM
# question measured (`gate_scores`, docs/changelog/FASE_4.md).
relevance_threshold = -2.0

# CV mode (Phase 4b): Chrystian's CV (.docx), LinkedIn profile (.pdf)
# and biography (.md, Spanish original + English version), indexed as
# they are, each in its own language.
# Word/PDF go through Docling (src/rag/ingestion/loaders.py). Git-ignored.
[sources.cv]
description = "Chrystian Donaire Villén, the author of this project: CV, LinkedIn profile and biography (education, jobs, projects, skills, hobbies, contact)."
root = "data/raw/cv"
include = [".md", ".docx", ".pdf"]
default_chunker = "markdown_headers_packed"
# The phone number and the old e-mail stay in the files but are never
# shown: masked in the LLM context, the answer and the sources.
private_data = ["phone", "email"]
public_emails = ["cdonairevillen@gmail.com"]
private_replacement = "[dato privado]"
# Appended to the system prompt when answering from the CV (FASE_4.md,
# 4b): the 0.6B model mixed jobs and invented the secret literary world.
prompt_rules = """
The SOURCES describe one person, Chrystian Donaire Villén: his CV, his LinkedIn profile and his biography. Also follow these rules:
7. Answer about Chrystian in the third person.
8. Each job, project and date belongs to the company or project named next to it in the same source. Never mix details of different jobs.
9. Books, films and music in the SOURCES are his tastes, not works he created.
10. His literary world is a secret project: if asked about it, say only that it is secret and that more will be known soon.
11. His only public contact is the e-mail cdonairevillen@gmail.com. Never present it as another address. If asked for a phone number or any other contact detail, say that it is private and give that e-mail.
"""
# Calibrated with `gate_scores` for the 800-char chunks below (FASE_4.md,
# 4b): the global 0.0 rejected over 40% of valid English questions;
# -3.0 accepts 83% (en) / 90% (es) and no out-of-domain question.
# Rejections still end in the CV message below.
relevance_threshold = -3.0
# Questions that name the author go to the CV when it passes its gate,
# even if "about" (whose docs and code mention him) scores higher
# (FASE_7.md 7b.5; only CV benchmark questions match).
route_hints = ['\b(chrystian|donaire)\b']
# The English CV comes first for English questions and lacks the
# biography-only facts: more sources bring the biography in too.
answer_k = 8
# Smaller chunks (one job or section each) so the model does not mix
# facts of neighbouring jobs, and 8 of them fit the token budget.
chunk_size = 800
child_size = 400

[sources.cv.not_found_message]
es = "No dispongo de esa información, ¡pero puedes preguntárselo tú! cdonairevillen@gmail.com"
en = "I don't have that information, but you can ask him yourself! cdonairevillen@gmail.com"

# About (Phase 7a): the project explaining itself, from its own README,
# working docs and source code, read live from the repository (no copy:
# `make index SOURCE=about` after editing them). Left out: the data, the
# benchmarks, the web, the tests, the course SDK, the deployment bundle
# and stage (a copy of src/), and the initial planning documents.
[sources.about]
description = "This project itself, RAG against the Machine v2.0: what it is, how it works (ingestion, hybrid retrieval, router, generation, agent, MCP, web), its models, benchmarks, design decisions and history, and its source code."
root = "."
include = [".md", ".py"]
exclude_dirs = [
    "data", "bench", "web", "tests", "llm_sdk", "__pycache__",
    "node_modules", "PLANING.md", "RESPUESTA.md", "Elements_frontend.md",
    "CLAUDE.md",
]
# deploy/space/README.md is the old Hugging Face Space card (it still
# says the agent is on by default): the project's README covers it.
exclude_paths = ["deploy/stage", "deploy/bundle", "deploy/space/README.md"]
# The working docs exist in Spanish (docs/es/) and English (docs/). The
# filter below gives English questions only the English copy (Spanish
# ones keep both). Measured (FASE_7.md 7b.4, DEC-23): better retrieval
# and much better answers with Qwen3-0.6B, but fewer correct citations
# with the larger models, so it stays off until the author decides.
# translations = [
#     ["README.md", "docs/es/README.md"],
#     ["docs/", "docs/es/"],
# ]
# translation_languages = ["en"]
# Test transcripts quoting CV answers, marked inside the changelogs, are
# left out (they made the router pick "about" for CV questions).
skip_marked = true
# Own gate (`gate_scores`, FASE_7.md 7a.7): -1.0 accepts 83% (en) /
# 78% (es) of the questions about the project; the global 0.0 only 67%.
relevance_threshold = -1.0
# Questions that hint at the project go to "about" when it passes its
# gate (a hint alone never decides: XQuAD also has "the project").
route_hints = [
    '\b(the|el) (project|proyecto)\b',
]
# Questions that name it beyond doubt go to "about" whatever its score,
# and skip its gate (FASE_7.md 7b.5; no other benchmark question
# matches them).
route_names = [
    'rag against the machine',
    '\b(este|esta|tu|vuestro) (rag|proyecto|sistema|chatbot|asistente|web|aplicaci[oó]n)\b',
    '\b(this|your) (rag|project|system|chatbot|assistant|website|app)\b',
]
# The web always searches it (chip always on, it joins every filter).
pinned = true
code_extensions = [".py"]
default_chunker = "markdown_headers_packed"

[sources.about.chunkers]
".py" = "python_ast"
".md" = "markdown_headers_packed"

# Optional profiles: extra models as explicit options on top of the
# stable base above (which is what the official benchmark uses and gives
# the same results on any machine). Select with --profile <name>,
# RAG_PROFILE=<name> or `make <target> PROFILE=<name>`. A profile that
# changes embeddings needs `make index PROFILE=<name>` first.

[profiles.gpu-quality.retrieval]
# Best measured reranker (code R@5 0.86 vs 0.80), but ~4.4 s per question
# on GPU and ~23 s on CPU: only for machines with a GPU.
reranker_model = "BAAI/bge-reranker-v2-m3"

[profiles.cpu-light.embeddings]
# Index in ~13 min on CPU instead of ~2 h with bge-m3 (lower recall,
# see docs/BENCHMARK_REPORT.md).
model = "intfloat/multilingual-e5-small"

# Optional LLMs (generation only; no re-index needed): the rest of the
# Qwen3 family, plus Phi-4-mini as an alternative from another family.
# Quality and speed in docs/BENCHMARK_REPORT.md (SmolLM3-3B was measured
# and dropped: lowest F1 and most false refusals on code).
[profiles."llm-qwen3-1.7b".generation]
model = "Qwen/Qwen3-1.7B"

[profiles.llm-qwen3-4b.generation]
model = "Qwen/Qwen3-4B"

# 4B (~8 GB) + bge-m3 + reranker do not fit together in a 12 GB GPU:
# retrieval runs on CPU (same results, measured in Phase 2).
[profiles.llm-qwen3-4b.models]
device = "cpu"

[profiles.llm-phi4-mini.generation]
model = "microsoft/Phi-4-mini-instruct"
# Its repo code imports names removed from transformers 5; the native
# Phi3 implementation is used instead.
trust_remote_code = false
