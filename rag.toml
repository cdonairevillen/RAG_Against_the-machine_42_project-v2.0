# RAG Against the Machine — pipeline configuration.
# Every value can be overridden with an environment variable named
# RAG_<SECTION>_<KEY> (e.g. RAG_QDRANT_URL=http://other-host:6333).

[qdrant]
url = "http://localhost:6333"
collection_prefix = "rag_"
batch_size = 512

[paths]
processed_dir = "data/processed"

[chunking]
code_chunk_size = 2000
doc_chunk_size = 2000
code_child_size = 600
doc_child_size = 600

[models]
# "auto" = CUDA if a GPU is available, CPU otherwise (e.g. 42 machines
# without GPU). Force with "cpu" / "cuda" or RAG_MODELS_DEVICE=cpu.
device = "auto"

[retrieval]
# Tuned with `make bench` (see docs/changelog/FASE_2.md).
classifier_margin = 0.5
code_signal_weight = 0.5
doc_signal_weight = 0.5
# Code-mode queries are always reranked (v1 skipped it above 9.0).
skip_rerank_score = inf
# Out-of-domain filter used before generation only. Known to be a weak
# signal; to be replaced in Phase 3 (B15).
bm25_score_floor = 5.5
# Multilingual (ms-marco-MiniLM-L-6-v2 is English only); see
# docs/BENCHMARK_REPORT.md.
reranker_model = "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
# "rrf": fuse the reranker order with the BM25 order(s); "replace": the
# reranker order wins (v1 behaviour).
rerank_fusion = "rrf"
rrf_k = 60
# BM25 identifier splitting (`max_model_len` -> max model len):
# "none" | "query" | "both" | "code" (code chunks and code/general-index
# queries only). Changing it requires `make index`.
code_aware_tokens = "code"

[embeddings]
# Dense retrieval fused with BM25 (RRF), in both branches. Changing the
# model needs `make index`. Without a GPU, indexing with bge-m3 takes
# ~2 h; use intfloat/multilingual-e5-small (~13 min on CPU) instead.
enabled = true
model = "BAAI/bge-m3"
batch_size = 64
dense_k = 50
dense_in_doc_branch = true

# One block per knowledge source. `chunkers` maps a file extension to a
# chunker name (see src/ingestion/chunkers.py); unknown extensions fall
# back to `default_chunker`.
[sources.vllm]
root = "data/raw/vllm-0.10.1"
include = [".py", ".pyi", ".md", ".rst", ".txt"]
exclude_dirs = [
    "csrc", ".buildkite", ".github", "cmake", "docker", ".gemini",
    "requirements", "__pycache__", ".git", "node_modules", "tests",
    "examples",
]
code_extensions = [".py", ".pyi"]
default_chunker = "size"

[sources.vllm.chunkers]
".py" = "python_ast"
".pyi" = "python_ast"
".md" = "markdown_headers_packed"
".rst" = "markdown_headers_packed"
".txt" = "markdown_headers_packed"

# Optional profiles: extra models as explicit options on top of the
# stable base above (which is what the official benchmark uses and gives
# the same results on any machine). Select with --profile <name>,
# RAG_PROFILE=<name> or `make <target> PROFILE=<name>`. A profile that
# changes embeddings needs `make index PROFILE=<name>` first.

[profiles.gpu-quality.retrieval]
# Best measured reranker (code R@5 0.86 vs 0.80), but ~4.4 s per question
# on GPU and ~23 s on CPU: only for machines with a GPU.
reranker_model = "BAAI/bge-reranker-v2-m3"

[profiles.cpu-light.embeddings]
# Index in ~13 min on CPU instead of ~2 h with bge-m3 (lower recall,
# see docs/BENCHMARK_REPORT.md).
model = "intfloat/multilingual-e5-small"
